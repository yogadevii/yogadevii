<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Yoga dan Devi undangan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    .container {
      height: 100vh; /* full tinggi layar */
      display: flex;
      flex-direction: column;
    }
    .foto {
      flex: 1;
      width: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="3.jpg" alt="Foto 1" class="foto">
  </div>
</body>
</html>
